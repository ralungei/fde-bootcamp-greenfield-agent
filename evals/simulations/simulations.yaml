    response_guide: Say 'Je veux annuler ma ligne résidentielle'. Provide your phone number and PIN when
      prompted. Listen to the French contract disclosure and confirm
    max_turns: 10
  expectations:
  - The user successfully cancels their home phone service in French after hearing the mandatory contract
    disclosure
  session_parameters: {}
- name: sim__speak_immediate_english
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to speak to a human representative immediately to resolve a complex issue
    success_criteria: The user is immediately transferred to a live representative with the verbatim handoff
