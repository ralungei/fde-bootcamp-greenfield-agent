- name: sim__cancel_service_internet_english
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to cancel my home internet service because I am moving out of the country
    success_criteria: The user is authenticated, hears the mandatory contract disclosure, and confirms
      the cancellation request
    response_guide: Tell the agent you need to cancel your internet service. Provide your phone number
      and PIN when asked to authenticate. Listen to the contract terms and confirm you want to proceed
      with the cancellation
    max_turns: 10
  expectations:
  - The user completes the cancellation flow after hearing the mandatory contract disclosure
  session_parameters: {}
- name: sim__cancel_service_mobility_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: I want to cancel my mobile phone plan in French because I found a better deal with another provider
    success_criteria: The user is authenticated in French, hears the French contract disclosure, and confirms
      the cancellation
    response_guide: Speak French from the start by saying 'Je veux annuler mon forfait mobile'. Provide
      your phone number and PIN when prompted. Listen to the French contract disclosure and confirm you
      want to cancel
    max_turns: 10
  expectations:
  - The user completes the cancellation flow in French after hearing the mandatory contract disclosure
  session_parameters: {}
- name: sim__port_out_number_english
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to port my mobile number out to another carrier, which requires cancelling my current
      line
    success_criteria: The user is authenticated, hears the mandatory contract disclosure regarding porting
      out, and confirms the request
    response_guide: Tell the agent you want to port out your number. Provide your authentication details
      when prompted. Listen to the contract disclosure and confirm
    max_turns: 10
  expectations:
  - The user successfully requests a port out and hears the mandatory contract disclosure
  session_parameters: {}
- name: sim__cancel_tv_service_english
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to cancel my Fibe TV subscription because I am switching to streaming-only
    success_criteria: The user is authenticated, hears the mandatory contract disclosure, and confirms
