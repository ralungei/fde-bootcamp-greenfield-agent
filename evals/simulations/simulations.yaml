    max_turns: 10
  expectations:
  - The user successfully cancels their TV service after hearing the mandatory contract disclosure
  session_parameters: {}
- name: sim__cancel_home_phone_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: I want to cancel my residential landline phone service in French
    success_criteria: The user is authenticated in French, hears the French contract disclosure, and cancels
