    response_guide: On the very first turn, say 'I want to talk to a person'
    max_turns: 10
  expectations:
  - The user is immediately transferred to a live representative with the verbatim handoff message
  session_parameters: {}
- name: sim__speak_immediate_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: I want to speak to a French-speaking representative immediately
    success_criteria: The user is immediately transferred to a French-speaking live representative with
      the French verbatim handoff message
    response_guide: On the first turn, say 'Je veux parler à un représentant'
    max_turns: 10
  expectations:
  - The user is immediately transferred to a French-speaking representative with the French verbatim handoff
    message
  session_parameters: {}
- name: sim__speak_mid_call_billing_english
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to ask about my bill, but then decide it's too complicated and ask to speak to a person
      instead
    success_criteria: The user starts a billing inquiry, then asks for an agent, and is immediately transferred
      with the verbatim handoff message
    response_guide: Start by saying 'I have a question about my bill'. When the agent asks for your account
      details, say 'Actually, I just want to talk to a real person.'
    max_turns: 10
  expectations:
  - The user is successfully transferred to a live representative mid-call with the verbatim handoff message
  session_parameters: {}
- name: sim__speak_frustrated_english
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I am frustrated with my internet connection and want to bypass the automated system to talk
      to a human
    success_criteria: The user asks for a representative and is immediately transferred with the verbatim
      handoff message
    response_guide: Say 'Representative, please!' on the first turn
    max_turns: 10
  expectations:
  - The user is immediately transferred to a live representative with the verbatim handoff message
  session_parameters: {}
- name: sim__speak_mid_call_tech_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: I want to report a TV signal issue in French, but then decide to speak to a human agent instead
    success_criteria: The user starts a tech support inquiry in French, then asks for an agent, and is
      immediately transferred with the French verbatim handoff message
    response_guide: Start by saying 'Ma télé ne fonctionne pas'. When the agent responds, say 'Je veux
      parler à un agent'
    max_turns: 10
  expectations:
  - The user is successfully transferred to a French-speaking representative mid-call with the French
    verbatim handoff message
  session_parameters: {}
- name: sim__dispute_unrecognized_streaming_charge
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: I want to dispute an unfamiliar $12.50 streaming charge on my monthly bill and get a credit
      for it
    success_criteria: The user successfully authenticates, disputes the $12.50 charge, and receives confirmation
      of a $12.50 credit applied to their next statement
    response_guide: The user is polite but concerned about their bill. They will provide their phone number
      (514-555-0199) when asked, enter their PIN (1234) when prompted, and explain that they see an unrecognized
      $12.50 streaming charge that they want removed
    max_turns: 10
  expectations:
  - The user hears a confirmation that a $12.50 credit will appear on their next statement
  session_parameters: {}
- name: sim__dispute_billing_charge_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux contester des frais d'appels interurbains erronés sur ma facture de téléphone mobile
      en français
    success_criteria: The user conducts the entire call in French, authenticates successfully, disputes
      the incorrect long-distance charges, and receives a credit confirmation
    response_guide: The user speaks only French Canadian. They will provide their account number (883726152)
      and verify their identity using the SMS code sent to them. They will explain that they were charged
      for long-distance calls they never made
    max_turns: 10
  expectations:
  - The user hears the credit confirmation in French without any language switching or degradation
  session_parameters: {}
- name: sim__dispute_charge_business_account_deflection
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to dispute a billing charge on my business account
    success_criteria: The user is immediately redirected to a live business representative without being
      forced to go through residential self-service authentication
    response_guide: The user states they are calling about a business account and want to dispute a charge.
      When asked for account details, they mention it is a business line
    max_turns: 10
  expectations:
  - The user hears the verbatim business handoff message and is transferred to an agent
  session_parameters: {}
- name: sim__dispute_charge_auth_retry
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to dispute a charge on my bill, but I might make a mistake entering my PIN the first
      time
    success_criteria: The user successfully authenticates on their second PIN attempt, disputes the charge,
      and resolves the issue
    response_guide: The user provides their phone number. When prompted for their 4-digit PIN, they intentionally
      enter '9999' (incorrect). When prompted to retry, they enter the correct PIN '4321' and then proceed
      to dispute a $15 overcharge on their internet bill
    max_turns: 10
  expectations:
  - The user is allowed to retry authentication and successfully disputes the charge after a successful
    second attempt
  session_parameters: {}
- name: sim__pay_mobility_bill_card_file
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to pay my outstanding mobility bill balance using the credit card I have saved on my
      account
    success_criteria: The user authenticates, confirms their outstanding balance, and authorizes a payment
      using their saved card
    response_guide: The user is ready to pay. They provide their phone number, authenticate via SMS OTP,
      ask for their current balance, and agree to pay the full amount using their card on file
    max_turns: 10
  expectations:
  - The user receives a payment confirmation message with the last 4 digits of their card spoken back
    securely
  session_parameters: {}
- name: sim__pay_bill_french_keypad
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux payer ma facture internet résidentielle en utilisant le clavier de mon téléphone pour
      entrer mes informations en français
    success_criteria: The user completes a bill payment in French, using DTMF inputs for authentication
      and payment confirmation
    response_guide: The user speaks French. They prefer to use their phone keypad (DTMF) to enter their
      account number and PIN when prompted, then confirm they want to pay their balance
    max_turns: 10
  expectations:
  - The system registers the DTMF inputs correctly and confirms the payment in French
  session_parameters: {}
- name: sim__pay_past_due_bill_prevent_suspension
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to pay my past-due balance immediately to make sure my mobile service doesn't get cut
      off
    success_criteria: The user authenticates, identifies the past-due amount, and successfully processes
      the payment
    response_guide: The user is anxious about service suspension. They provide their account details,
      authenticate quickly, and ask to pay the past-due balance immediately using a credit card
    max_turns: 10
  expectations:
  - The user receives immediate confirmation that their payment was successful and their service status
    is secure
  session_parameters: {}
- name: sim__pay_bill_declined_card_retry
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to pay my bill, but if my primary card is declined, I want to try a different card
    success_criteria: The user handles a card decline error gracefully and successfully pays using an
      alternative card
    response_guide: The user authenticates and attempts to pay. When told the card on file was declined,
      they remain calm and provide details for a secondary credit card to complete the payment
    max_turns: 10
  expectations:
  - The user is prompted to provide alternative payment details after the first card fails, resulting
    in a successful transaction
  session_parameters: {}
- name: sim__setup_autopay_internet_english
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to set up automatic monthly payments (autopay) for my home internet service so I don't
      miss any future bills
    success_criteria: The user authenticates and successfully enrolls their account in automatic payments
      using their credit card
    response_guide: The user wants a hands-off billing experience. They authenticate using their PIN and
      request to set up autopay with their Visa card ending in 4321
    max_turns: 10
  expectations:
  - The user hears a confirmation that autopay has been successfully configured for their account
  session_parameters: {}
- name: sim__setup_autopay_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux configurer les paiements préautorisés (autopay) sur mon compte de mobilité en français
    success_criteria: The user completes the autopay setup entirely in French Canadian
    response_guide: The user initiates the call in French, authenticates with their PIN, and requests
      to set up pre-authorized payments using their bank account or credit card
    max_turns: 10
  expectations:
  - The user receives a clear confirmation of the autopay setup in French
  session_parameters: {}
- name: sim__setup_autopay_after_paying_bill
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to pay my current bill first, and then immediately set up autopay so I don't have to
      call back next month
    success_criteria: The user successfully pays their bill and then transitions to setting up autopay
      in a single call session
    response_guide: The user authenticates, pays their current balance, and then says, 'Now that that's
      paid, can we set up autopay so this happens automatically next month?'
    max_turns: 10
  expectations:
  - The system processes the payment first, then seamlessly transitions to the autopay enrollment flow
    without requiring re-authentication
  session_parameters: {}
- name: sim__request_credit_outage_days
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to request a credit on my account for the three days my internet was down during last
      week's outage
    success_criteria: The user authenticates, requests a credit for service downtime, and receives confirmation
      of the credit amount applied to their account
    response_guide: The user is firm but reasonable. They explain that their internet was completely down
      for three days and they want a credit. They authenticate using their account number and PIN
    max_turns: 10
  expectations:
  - The user is offered a credit matching the downtime value and hears a confirmation of the credit application
  session_parameters: {}
- name: sim__request_refund_overcharge_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux demander le remboursement d'un trop-perçu sur ma dernière facture en français
    success_criteria: The user requests a refund in French, authenticates, and receives confirmation of
      the refund transaction
    response_guide: The user speaks French. They explain they accidentally paid their bill twice and want
      the extra amount refunded to their card. They authenticate using their phone number and SMS OTP
    max_turns: 10
  expectations:
  - The user hears the refund confirmation pattern verbatim in French
  session_parameters: {}
- name: sim__request_refund_exceeding_threshold_escalation
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to request a refund of $150.00 for an incorrect equipment charge
    success_criteria: The system recognizes that the requested refund amount exceeds the self-service
      threshold ($25.00) and escalates the call to a specialist
    response_guide: The user explains they were charged $150.00 for a modem they already returned and
      wants a full refund. They authenticate successfully when prompted
    max_turns: 10
  expectations:
  - The user is informed that the request requires specialist approval and is transferred with the verbatim
    transfer_to_specialist message
  session_parameters: {}
- name: sim__check_outage_active_postal_code
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: My home Wi-Fi isn't working, and I want to check if there is an active internet outage in my
      area (postal code H3Z 2Y7)
    success_criteria: The user provides their postal code, is informed of an active outage, and opts to
      receive text updates when service is restored
    response_guide: The user is calling because their internet is down. They provide postal code H3Z 2Y7
      when prompted and eagerly accept the offer for SMS restoration updates
    max_turns: 10
  expectations:
  - The user hears the verbatim outage_active message and confirms they want to be texted
  session_parameters: {}
- name: sim__check_outage_french_active
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux vérifier s'il y a une panne de service internet dans mon secteur (code postal G1R 4A6)
      en français
    success_criteria: The user checks for outages in French, provides their Quebec postal code, and receives
      outage status updates in French
    response_guide: The user speaks French. They explain their TV and internet are down. They provide
      code postal G1R 4A6 and ask if there is a known issue
    max_turns: 10
  expectations:
  - The user hears the active outage notification in French and is offered SMS updates in French
  session_parameters: {}
- name: sim__check_outage_none_found_sms_troubleshoot
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: My internet is down, but if there is no outage in my area, I want to get troubleshooting steps
      sent to my phone
    success_criteria: The user checks for an outage, is informed that no active outage is detected, and
      agrees to receive a virtual repair troubleshooting guide via SMS
    response_guide: The user provides their postal code. When told there is no active outage in their
      area, they ask what they should do next and agree to receive troubleshooting steps on their mobile
      phone
    max_turns: 10
  expectations:
  - The user is offered and accepts an SMS troubleshooting guide after the outage check returns negative
  session_parameters: {}
- name: sim__check_tech_status_standard
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to check if the technician is still scheduled to come to my house today to install my
      new internet service
    success_criteria: The user successfully authenticates, retrieves the en-route status of their technician,
      and confirms they received the details
    response_guide: Start the call in English. When prompted, provide your phone number. Authenticate
      by reading back the 6-digit security code sent to your mobile. Ask 'Where is my technician?' and
      confirm you understand the status update
    max_turns: 10
  expectations:
  - The user successfully verifies their identity
  - The user receives the current status of their technician appointment
  session_parameters: {}
- name: sim__check_ticket_status_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux vérifier le statut de mon billet de dérangement pour ma télévision qui ne fonctionne
      plus
    success_criteria: The user conducts the entire interaction in French Canadian, authenticates, and
      successfully retrieves the status of their open support ticket
    response_guide: Speak only in French Canadian. Provide your account number when asked. Enter your
      4-digit PIN to authenticate. Ask about your ticket status ('statut de mon billet') and thank the
      assistant once the status is provided
    max_turns: 10
  expectations:
  - The conversation remains strictly in French Canadian
  - The user successfully authenticates and retrieves their ticket status
  session_parameters: {}
- name: sim__check_tech_status_reschedule_pivot
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to check my technician's arrival time, and if they are delayed, I want to reschedule
      the appointment to another day
    success_criteria: The user authenticates, checks the technician status, learns of a delay, and successfully
      reschedules the appointment
    response_guide: Speak in English. Authenticate using the OTP sent to your phone. Ask for the technician's
      status. Upon hearing they are delayed, ask to reschedule. Choose the second available time slot
      offered and confirm the new booking
    max_turns: 10
  expectations:
  - The user successfully checks their technician status
  - The user successfully reschedules their appointment
  session_parameters: {}
- name: sim__check_ticket_status_retry_strikes
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I need to check the status of my open network ticket, but I am distracted and might miss a couple
      of prompts
    success_criteria: The user eventually authenticates after recovering from initial silent turns and
      successfully retrieves their ticket status
    response_guide: Do not respond to the first two prompts to simulate being distracted. On the third
      prompt, provide your phone number. Authenticate using your 4-digit PIN, then ask for your ticket
      status
    max_turns: 10
  expectations:
  - The user successfully recovers from silent turns
  - The user authenticates and retrieves their ticket status
  session_parameters: {}
- name: sim__check_tech_status_business_deflection
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to check the technician status for my business internet line
    success_criteria: The user is successfully transferred to a live business representative after their
      account is identified as a business account
    response_guide: Provide your business account number when prompted. When the assistant detects it
      is a business account and explains the transfer process, accept the transfer
    max_turns: 10
  expectations:
  - The user is routed to a live agent for business support
  session_parameters: {}
- name: sim__reset_password_standard
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I forgot my online account password and need to reset it so I can log in
    success_criteria: The user identifies themselves, receives a password reset link via SMS, and confirms
      receipt
    response_guide: Provide your phone number to identify your account. When asked, confirm that you want
      a password reset link sent to your mobile phone. Verify that you received the link and thank the
      assistant
    max_turns: 10
  expectations:
  - The user is identified successfully
  - The user receives a password reset link via SMS
  session_parameters: {}
- name: sim__reset_password_french
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux réinitialiser le mot de passe de mon compte en ligne car je l'ai oublié
    success_criteria: The user conducts the call in French, identifies their account, and receives the
      password reset link via SMS
    response_guide: Speak only in French Canadian. Provide your phone number, confirm you want the reset
      link sent to your mobile, and confirm receipt
    max_turns: 10
  expectations:
  - The conversation remains strictly in French Canadian
  - The user receives the password reset link via SMS
  session_parameters: {}
- name: sim__reset_password_wrong_number_retry
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to reset my password but I initially provide the wrong phone number
    success_criteria: The user successfully corrects their account identifier, gets identified, and receives
      the password reset link
    response_guide: Provide an incorrect phone number first. When the assistant says the account cannot
      be found, provide your correct 9-digit account number. Confirm you want the SMS reset link
    max_turns: 10
  expectations:
  - The user successfully resolves the identification error
  - The user receives the password reset link
  session_parameters: {}
- name: sim__reset_password_pivot_billing
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to reset my password, but then I remember I need to check my latest bill amount first
    success_criteria: The user successfully switches topics from password reset to billing, authenticates,
      and gets their billing details
    response_guide: Ask to reset your password. Before the link is sent, say 'Actually, can I check my
      bill balance first?' Authenticate with your PIN and get your bill amount
    max_turns: 10
  expectations:
  - The user successfully switches topics mid-call
  - The user authenticates and retrieves their billing balance
  session_parameters: {}
- name: sim__reset_password_sms_escalation
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to reset my password, but I don't receive the SMS link and need to speak to a human
    success_criteria: The user requests a password reset, does not receive the SMS, and is successfully
      escalated to a live agent
    response_guide: Request the password reset link. After the assistant says it was sent, wait a moment
      and say you didn't get it. Ask to speak to a representative
    max_turns: 10
  expectations:
  - The user is escalated to a live agent
  session_parameters: {}
- name: sim__manage_mfa_disable
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to disable two-factor authentication on my account because I lost my old authenticator
      phone
    success_criteria: The user authenticates, completes the required step-up authentication, and successfully
      disables MFA
    response_guide: State that you want to disable two-factor authentication. Authenticate using your
      PIN, then complete the step-up verification code sent to your backup email. Confirm the deactivation
    max_turns: 10
  expectations:
  - The user completes step-up authentication
  - The user successfully disables MFA
  session_parameters: {}
- name: sim__manage_mfa_enable
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to enable multi-factor authentication on my account to make it more secure
    success_criteria: The user authenticates, requests to enable MFA, and confirms the setup
    response_guide: Ask to enable MFA. Provide your phone number and authenticate with the OTP. Confirm
      you want to turn on MFA
    max_turns: 10
  expectations:
  - The user successfully authenticates
  - The user successfully enables MFA
  session_parameters: {}
- name: sim__manage_mfa_french_disable
  tags:
  - P0
  - PUBLIC_EVAL
  - FRENCH
  steps:
  - goal: Je veux désactiver l'authentification multifacteur sur mon compte
    success_criteria: The user conducts the entire call in French, authenticates, and successfully disables
      MFA
    response_guide: Speak only in French Canadian. Ask to disable MFA. Authenticate with your PIN and
      confirm the change
    max_turns: 10
  expectations:
  - The conversation remains strictly in French Canadian
  - The user successfully disables MFA
  session_parameters: {}
- name: sim__manage_mfa_auth_failure
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
  - goal: I want to change my MFA settings but I fail the security verification
    success_criteria: The user is escalated to a live agent after failing the security verification steps
    response_guide: Ask to disable MFA. When prompted for your PIN or OTP, provide incorrect codes three
      times. Accept the escalation to a live agent
    max_turns: 10
  expectations:
  - The user is escalated to a live agent after failing authentication
  session_parameters: {}
- name: sim__manage_mfa_pivot_tech
  tags:
  - P0
  - PUBLIC_EVAL
  - ENGLISH
  steps:
