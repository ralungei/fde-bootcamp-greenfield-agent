  :root {
    color-scheme: light;

    --bg: #ffffff;
    --ink: #202124;
    --ink-2: #3c4043;
    --muted: #5f6368;
    --faint: #9aa0a6;
    --line: #e8eaed;
    --line-2: #dadce0;
    --surface: #f8f9fa;

    /* blue family */
    --b-50: #f4f8fe;
    --b-100: #e8f0fe;
    --b-200: #d2e3fc;
    --b-300: #aecbfa;
    --b-400: #669df6;
    --b-500: #4285f4;
    --b-600: #1a73e8;
    --b-700: #1967d2;
    --b-800: #174ea6;
    --b-900: #0d3c78;
    --cyan: #12b5cb;
    --cyan-50: #e4f7fa;
    --cyan-800: #007b83;
    --indigo: #3f51b5;
    --indigo-50: #eceffc;

    --ok: #188038;
    --no: #c5221f;

    --sans: "Google Sans", "Google Sans Text", "Product Sans", "Roboto Flex Embedded", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* motion */
    --ease-emph: cubic-bezier(0.2, 0, 0, 1);
    --ease-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
    --ease-spring: cubic-bezier(0.34, 1.28, 0.64, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------------- chrome ---------------- */

  .topbar { position: absolute; top: 0; right: 0; z-index: 6; padding: 1rem 1.6rem; }

  .toggle {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 0.36rem 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .toggle[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .toggle:hover { border-color: var(--faint); }
  .toggle:focus-visible { outline: 2px solid var(--b-600); outline-offset: 2px; }
  .toggle .kbd { opacity: 0.55; font-size: 0.68rem; }

  .lang-switch {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 0.16rem;
    gap: 0.12rem;
  }
  .lang-btn {
    font-family: inherit;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 0.22rem 0.58rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .lang-btn:hover { color: var(--ink); }
  .lang-btn.active {
    background: var(--ink);
    color: #fff;
  }


  /* ---------------- stage ---------------- */

  .stage { flex: 1; min-height: 0; display: flex; position: relative; }

  .slide { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .slide.active { display: flex; }

  .canvas {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 1.05rem 4.6rem;
    position: relative;
  }

  .inner {
    width: 100%;
    max-width: 72rem;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    position: relative;
    z-index: 1;
  }

  /* ---------------- living background ---------------- */

  /* deliberately NOT a view-transition element: naming it would freeze it
     as a snapshot and paint it over the content during a transition */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .blob {
    position: absolute;
    width: 40vw;
    height: 40vw;
    min-width: 380px;
    min-height: 380px;
    border-radius: 50%;
    filter: blur(66px);
    will-change: transform, opacity, background;
    transition:
      background 1.5s var(--ease-emph),
      opacity 1.5s var(--ease-emph),
      translate 1.6s var(--ease-emph),
      scale 1.6s var(--ease-emph);
  }

  .b1 { left: -16vw; top: -19vw; background: #4285f4; opacity: 0.3; animation: float1 34s ease-in-out infinite; }
  .b2 { right: -17vw; top: -16vw; background: #9b72cb; opacity: 0.26; animation: float2 41s ease-in-out infinite; }
  .b3 { right: -13vw; bottom: -23vw; background: #f9ab00; opacity: 0.24; animation: float3 37s ease-in-out infinite; }
  .b4 { left: -14vw; bottom: -22vw; background: #d96570; opacity: 0.22; animation: float4 45s ease-in-out infinite; }

  /* centre light: what actually tints the cards */
  .b5 {
    left: 50%; top: 47%;
    width: 38vw; height: 29vw;
    margin-left: -19vw; margin-top: -14.5vw;
    background: #669df6;
    opacity: 0.14;
    filter: blur(88px);
    animation: float5 52s ease-in-out infinite;
  }

  /* scene 1, foundation: the palette collapses into blue, light pulls left */
  body[data-scene="1"] .b1 { background: #1a73e8; opacity: 0.20; translate: 6vw 4vw; scale: 0.85; }
  body[data-scene="1"] .b2 { background: #669df6; opacity: 0.16; translate: -8vw 6vw; scale: 0.8; }
  body[data-scene="1"] .b3 { background: #aecbfa; opacity: 0.29; translate: -6vw 8vw; scale: 0.9; }
  body[data-scene="1"] .b4 { background: #d2e3fc; opacity: 0.29; translate: 4vw -6vw; scale: 0.95; }
  body[data-scene="1"] .b5 { background: #4285f4; opacity: 0.14; translate: 2vw -3vw; scale: 1.05; }

  /* scene 2, control: cyan enters, light swings right */
  body[data-scene="2"] .b1 { background: #12b5cb; opacity: 0.16; translate: 24vw 10vw; scale: 0.75; }
  body[data-scene="2"] .b2 { background: #4285f4; opacity: 0.20; translate: -4vw 12vw; scale: 0.9; }
  body[data-scene="2"] .b3 { background: #669df6; opacity: 0.22; translate: -14vw 4vw; scale: 0.85; }
  body[data-scene="2"] .b4 { background: #e4f7fa; opacity: 0.41; translate: 14vw -10vw; scale: 1; }
  body[data-scene="2"] .b5 { background: #12b5cb; opacity: 0.12; translate: -4vw 2vw; scale: 1; }

  /* scene 3, reach: indigo deepens, light rises */
  body[data-scene="3"] .b1 { background: #3f51b5; opacity: 0.15; translate: 10vw 16vw; scale: 0.8; }
  body[data-scene="3"] .b2 { background: #1a73e8; opacity: 0.18; translate: -12vw 2vw; scale: 0.95; }
  body[data-scene="3"] .b3 { background: #aecbfa; opacity: 0.26; translate: -20vw -6vw; scale: 0.8; }
  body[data-scene="3"] .b4 { background: #8ab4f8; opacity: 0.22; translate: 8vw -14vw; scale: 0.85; }
  body[data-scene="3"] .b5 { background: #9b72cb; opacity: 0.12; translate: 3vw 3vw; scale: 0.95; }

  /* scene 4, close: the full spectrum returns, wide open */
  body[data-scene="4"] .b1 { background: #4285f4; opacity: 0.26; translate: -2vw -2vw; scale: 1.05; }
  body[data-scene="4"] .b2 { background: #9b72cb; opacity: 0.24; translate: 2vw -2vw; scale: 1.05; }
  body[data-scene="4"] .b3 { background: #f9ab00; opacity: 0.22; translate: 2vw 2vw; scale: 1.05; }
  body[data-scene="4"] .b4 { background: #d96570; opacity: 0.20; translate: -2vw 2vw; scale: 1.05; }
  body[data-scene="4"] .b5 { background: #d96570; opacity: 0.10; translate: 0 -2vw; scale: 1.1; }

  /* scene 5, presenter only: drained */
  body[data-scene="5"] .blob { background: #9aa0a6; opacity: 0.10; scale: 0.7; }

  @keyframes float1 { 50% { transform: translate(6vw, 4vw) scale(1.1); } }
  @keyframes float2 { 50% { transform: translate(-5vw, 6vw) scale(1.14); } }
  @keyframes float3 { 50% { transform: translate(-7vw, -5vw) scale(1.08); } }
  @keyframes float4 { 50% { transform: translate(5vw, -6vw) scale(1.12); } }
  @keyframes float5 { 50% { transform: translate(3vw, -3vw) scale(1.16); } }

  /* ---------------- title slide ---------------- */

  .hero .inner { gap: 1.5rem; align-items: flex-start; }

  .kicker {

    background: #fff;

    padding: 0.35rem 0.9rem 0.35rem 0.5rem;
  }

  .spark { width: 16px; height: 16px; }

  /* ---------------- step head ---------------- */

  .eyebrow { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin: 0; }

  .step-badge {
    font-size: 0.95rem;

  .asked {
    font-size: 0.76rem;
    font-weight: 500;

    background: var(--b-100);

  }

  h2 {
    font-size: clamp(1.6rem, 3.2vw, 2.35rem);
    line-height: 1.14;
    letter-spacing: -1px;
    font-weight: 400;
    margin: 0;
    max-width: 26ch;
    text-wrap: balance;
  }

  .head { display: flex; flex-direction: column; gap: 0.2rem; }

  .step-head {
    display: flex;
    align-items: flex-start;

    margin-bottom: 0.35rem;
  }

  .step-num-big {

  .tagline {
    font-size: clamp(0.95rem, 1.3vw, 1.08rem);

  }

  .stats { display: flex; flex-wrap: wrap; gap: 0.2rem 2rem; align-items: flex-end; }
  .stat { display: flex; flex-direction: column; }
  .stat b {
    font-size: clamp(1.15rem, 2.1vw, 1.6rem);
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--b-700);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .stat span { font-size: 0.74rem; color: var(--muted); }

  /* ---------------- bento ---------------- */

  .bento {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-auto-rows: minmax(4rem, auto);
    gap: 0.45rem;
  }

  .tile {
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    border: 1px solid transparent;
    padding: 0.55rem 0.8rem 0.65rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    justify-content: flex-end;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }

  .tile.lift { box-shadow: 0 2px 12px rgba(32, 33, 36, 0.1); }

  .v-white { background: #fff; color: var(--ink); box-shadow: 0 2px 12px rgba(32, 33, 36, 0.09); }
  .v-white h3 { color: var(--b-900); }

  .when {
    display: block;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 0.1rem;
  }

  /* step 2, cool: cyan into indigo and purple */
  .tile.v-gem2 {
    background: linear-gradient(112deg, #12b5cb 0%, #4285f4 34%, #3f51b5 66%, #9b72cb 100%);
  }

  /* step 3, fresh: green through teal into blue */
  .tile.v-gem3 {
    background: linear-gradient(112deg, #34a853 0%, #0f9d9a 26%, #12b5cb 48%, #4285f4 76%, #9b72cb 100%);
  }

  .tile.v-gem2::after, .tile.v-gem3::after {
    background-image:
      radial-gradient(circle at center, rgba(255, 255, 255, 0.18) 1.1px, transparent 1.2px),
      linear-gradient(to top, rgba(0, 0, 0, 0.3), transparent 58%);
    background-size: 14px 14px, 100% 100%;
  }

  .tile.v-full {
    background: linear-gradient(112deg, #34a853 0%, #12b5cb 34%, #1a73e8 74%, #174ea6 100%);
  }

  .tile.v-full::after {
    background-image:
      radial-gradient(circle at center, rgba(255, 255, 255, 0.18) 1.1px, transparent 1.2px),
      linear-gradient(to top, rgba(0, 0, 0, 0.34), transparent 58%);
    background-size: 14px 14px, 100% 100%;
  }

  .art-login { right: 0.7rem; top: 0.6rem; }

  .al-box {
    width: 5.4rem;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(32, 33, 36, 0.16);
    padding: 0.45rem 0.5rem;
    display: flex; flex-direction: column; gap: 0.28rem;
  }

  .al-box i { display: block; height: 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); }
  .al-box span {
    font-size: 0.6rem; font-weight: 500; color: #fff;
    background: var(--b-600); border-radius: 999px;
    padding: 0.16rem 0; text-align: center;
  }

  .art-step { right: 0.9rem; top: 0.85rem; display: flex; gap: 0.22rem; }
  .art-step i { width: 14px; height: 4px; border-radius: 999px; background: rgba(26, 115, 232, 0.2); }
  .art-step i.on { background: var(--b-600); }
  .v-solid .art-step i, .v-gemini .art-step i { background: rgba(255, 255, 255, 0.35); }
  .v-solid .art-step i.on, .v-gemini .art-step i.on { background: #fff; }
  .tile.flat { box-shadow: none; }
  .tile.flat:hover { box-shadow: 0 4px 14px rgba(32, 33, 36, 0.1); }
  .v-white .ficon { background: var(--surface); color: var(--b-700); }

  .tile.static { cursor: default; }
  .tile.static:hover { transform: none; box-shadow: none; }
  .tile.static.v-white:hover { box-shadow: 0 2px 12px rgba(32, 33, 36, 0.09); }

  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(32, 33, 36, 0.13); }
  .tile:focus-visible { outline: 3px solid var(--b-600); outline-offset: 2px; }

  .tile h3 {
    margin: 0;
    font-weight: 500;
    letter-spacing: -0.3px;
    line-height: 1.18;
    font-size: 1.12rem;
  }

  .tile p { margin: 0; font-size: 0.92rem; line-height: 1.35; opacity: 0.82; }

  .bignum {
    display: block;
    font-size: clamp(2.2rem, 4.4vw, 3.3rem);
    line-height: 1;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    margin: 0.35rem 0 0.15rem;
  }

  .chip.light {
    display: inline-block;
    margin-top: 0.5rem;
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
  }

  .tile .ficon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
  }

  .tile .ficon svg { width: 19px; height: 19px; }

  /* sizes */
  .bento.cols8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .sp2 { grid-column: span 2; }
  .sp3 { grid-column: span 3; }
  .sp4 { grid-column: span 4; }
  .sp3 h3, .sp4 h3 { font-size: 1.45rem; letter-spacing: -0.5px; }
  .rw2 h3 { font-size: 1.35rem; letter-spacing: -0.45px; }
  .sp3 .ficon, .sp4 .ficon { width: 44px; height: 44px; }
  .sp3 .ficon svg, .sp4 .ficon svg { width: 23px; height: 23px; }
  .rw2 { grid-row: span 2; justify-content: space-between; }

  /* ---- variants: tonal Material surfaces, one gradient hero, some texture ---- */

  /* the headline capability of each step */
  .v-gemini {
    background: linear-gradient(118deg, #1a73e8 0%, #4285f4 26%, #9b72cb 56%, #d96570 82%, #f9ab00 100%);
    color: #fff;
  }
  .v-gemini .ficon { background: rgba(255, 255, 255, 0.24); color: #fff; }
  .v-gemini::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at center, rgba(255,255,255,0.2) 1.1px, transparent 1.2px),
      linear-gradient(to top, rgba(13, 60, 120, 0.42), transparent 62%);
    background-size: 14px 14px, 100% 100%;
  }

  /* solid blue with a dot field */
  .v-solid { background: var(--b-600); color: #fff; }
  .v-solid .ficon { background: rgba(255, 255, 255, 0.22); color: #fff; }
  .v-solid::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle at center, rgba(255,255,255,0.22) 1.1px, transparent 1.2px);
    background-size: 13px 13px;
    opacity: 0.6;
  }

  /* deep blue with diagonals */
  .v-deep { background: var(--b-800); color: #fff; }
  .v-deep .ficon { background: rgba(255, 255, 255, 0.18); color: #fff; }
  .v-deep::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(48deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 11px);
  }

  /* tonal surfaces, flat and calm */
  .v-tone1 { background: rgba(244, 248, 254, 0.66); backdrop-filter: blur(14px); color: var(--b-900); }
  .v-tone1 .ficon { background: #fff; color: var(--b-700); }

  .v-tint { background: rgba(232, 240, 254, 0.7); backdrop-filter: blur(14px); color: var(--b-900); }
  .v-tint .ficon { background: rgba(255, 255, 255, 0.8); color: var(--b-700); }

  .v-tint2 { background: rgba(210, 227, 252, 0.72); backdrop-filter: blur(14px); color: var(--b-900); }
  .v-tint2 .ficon { background: rgba(255, 255, 255, 0.8); color: var(--b-800); }

  .v-outline { background: rgba(255, 255, 255, 0.62); backdrop-filter: blur(14px); color: var(--ink); }
  .v-outline h3 { color: var(--b-900); }
  .v-outline .ficon { background: #fff; color: var(--b-700); }

  .v-cyan { background: rgba(228, 247, 250, 0.7); backdrop-filter: blur(14px); color: #06404b; }
  .v-cyan .ficon { background: rgba(255, 255, 255, 0.85); color: var(--cyan-800); }

  .v-indigo { background: rgba(236, 239, 252, 0.72); backdrop-filter: blur(14px); color: #1f2a63; }
  .v-indigo .ficon { background: rgba(255, 255, 255, 0.85); color: var(--indigo); }

  /* one textured tonal card per step */
  .v-grid-tex { background: rgba(232, 240, 254, 0.68); backdrop-filter: blur(14px); color: var(--b-900); }
  .v-grid-tex .ficon { background: rgba(255, 255, 255, 0.85); color: var(--b-700); }
  .v-grid-tex::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(26,115,232,0.1) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(26,115,232,0.1) 1px, transparent 1px);
    background-size: 18px 18px;
  }

  /* the model card */
  .v-spec { background: rgba(255, 255, 255, 0.68); backdrop-filter: blur(14px); border-color: var(--line-2); color: var(--ink); }
  .v-spec .ficon { background: var(--b-50); color: var(--b-700); }
  .v-spec h3 { font-size: 0.85rem !important; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .v-spec::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(90deg, rgba(66,133,244,0.08) 1px, transparent 1px);
    background-size: 9px 100%;
  }

  .spec-name {
    display: block;
    font-size: 1.18rem;
    font-weight: 500;
    color: var(--b-800);
    letter-spacing: -0.4px;
  }

  .v-glass { background: linear-gradient(140deg, rgba(244,248,254,0.6), rgba(210,227,252,0.72)); backdrop-filter: blur(14px); color: var(--b-900); }
  .v-glass .ficon { background: rgba(255, 255, 255, 0.85); color: var(--b-700); }

  .tile > * { position: relative; z-index: 1; }
  .tile .detail { display: none; }

  /* ---- in-tile widget previews: the card shows the thing, not just names it ---- */

  .art {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    width: max-content;
  }

  .art-pair .ap-card, .art-basket span, .art-haul span { flex: none; }

  .tile.has-art h3, .tile.has-art p { max-width: 64%; }
  .tile.rw2.has-art .art-haul ~ div h3 { max-width: 100%; }
  .tile.has-art .art-basket ~ div { margin-top: 2.4rem; }
  .tile.has-art .art-basket ~ div h3, .tile.has-art .art-basket ~ div p { max-width: 100%; }

  /* tall tiles put the copy on top and let the art own the bottom half */
  .tile.rw2.has-art { justify-content: flex-start; gap: 0.5rem; }
  .tile.rw2.has-art h3, .tile.rw2.has-art p { max-width: 100%; }
  .tile.has-art.wide-art h3, .tile.has-art.wide-art p { max-width: 48%; }

  /* carousel + comparison peeking from the corner */
  .art-widgets { right: -1.4rem; bottom: -1.2rem; display: flex; gap: 0.35rem; align-items: flex-end; }

  .aw-card {
    width: 3.6rem;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(32, 33, 36, 0.16);
    padding: 0.3rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    transform-origin: bottom center;
  }

  .aw-card img { width: 100%; height: 2.4rem; object-fit: contain; }
  .aw-card i { display: block; height: 4px; border-radius: 999px; background: var(--line-2); }
  .aw-card i.px { width: 55%; background: var(--b-300); }
  .aw-card:nth-child(1) { transform: rotate(-7deg) translateY(0.35rem); }
  .aw-card:nth-child(2) { transform: rotate(-2deg); }
  .aw-card:nth-child(3) { transform: rotate(4deg) translateY(0.25rem); }

  .aw-table {
    width: 6.4rem;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(32, 33, 36, 0.16);
    padding: 0.35rem;
    display: flex;
    flex-direction: column;
    gap: 0.22rem;
    transform: rotate(3deg) translateY(-0.3rem);
  }

  .aw-table .r { display: flex; gap: 0.22rem; align-items: center; }
  .aw-table .r i { height: 4px; border-radius: 999px; background: var(--line); flex: 1; }
  .aw-table .r i.h { background: var(--b-300); }
  .aw-table .r img { width: 0.9rem; height: 0.9rem; object-fit: contain; }

  /* mini trolley panel */
  .art-trolley {
    right: 0.6rem; bottom: 0.6rem;
    width: 10.5rem;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(13, 60, 120, 0.28);
    padding: 0.5rem 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.32rem;
  }

  .at-row { display: flex; align-items: center; gap: 0.4rem; }
  .at-row img { width: 1.5rem; height: 1.7rem; object-fit: contain; }
  .at-row i { flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
  .at-row b { font-size: 0.62rem; color: var(--b-800); font-weight: 500; }
  .at-total {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid var(--line); padding-top: 0.3rem;
    font-size: 0.62rem; color: var(--muted);
  }
  .at-total b { font-size: 0.78rem; color: var(--b-800); }

  /* two chat layouts */
  .art-layouts { right: 0.7rem; bottom: 0.7rem; display: flex; gap: 0.45rem; }

  .al-page {
    width: 4.4rem; height: 3rem;
    background: #fff;
    border: 1px solid var(--line-2);
    border-radius: 7px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(32, 33, 36, 0.1);
  }

  .al-page::before {
    content: ""; position: absolute; left: 0.3rem; top: 0.3rem; right: 0.3rem; height: 3px;
    background: var(--line); border-radius: 999px;
  }

  .al-bubble {
    position: absolute; right: 0.3rem; bottom: 0.3rem;
    width: 1.1rem; height: 1.1rem; border-radius: 50%;
    background: var(--b-600);
  }

  .al-panel {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 1.6rem; background: var(--b-600);
  }

  /* search bar */
  .art-search { right: 0.8rem; bottom: 0.8rem; }

  .as-bar {
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
    box-shadow: none;
    padding: 0.32rem 0.7rem 0.32rem 0.5rem;
    font-size: 0.72rem; color: var(--ink-2);
  }

  .as-bar svg { width: 12px; height: 12px; color: var(--b-600); }
  .as-bar .caret { width: 1px; height: 0.8rem; background: var(--b-600); animation: blink 1.1s steps(1) infinite; }

  @keyframes blink { 50% { opacity: 0; } }

  /* mini dial */
  .art-dial { right: 0.9rem; bottom: 0.9rem; width: 7.5rem; }

  .ad-track {
    height: 6px; border-radius: 999px; position: relative;
    background: linear-gradient(90deg, var(--b-100), var(--b-300), var(--b-600), var(--b-900));
  }

  .ad-knob {
    position: absolute; top: 50%; left: 84%;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 3px solid var(--b-800);
    transform: translate(-50%, -50%);
  }

  .ad-scale { display: flex; justify-content: space-between; font-size: 0.58rem; color: var(--muted); margin-top: 0.25rem; }

  /* basket counter */
  .art-count { right: 1rem; bottom: 0.9rem; text-align: right; }
  .art-count b { display: block; font-size: 2.2rem; line-height: 1; letter-spacing: -1.4px; }
  .art-count span { font-size: 0.68rem; opacity: 0.8; }

  /* floating filter chips */
  .art-chips { right: 0.55rem; bottom: 0.6rem; display: flex; flex-direction: column; align-items: flex-end; gap: 0.28rem; }

  .art-chips span {
    font-family: var(--mono);
    font-size: 0.6rem;
    background: #fff;
    color: var(--b-800);
    border-radius: 999px;
    padding: 0.22rem 0.6rem;
    box-shadow: 0 3px 10px rgba(32, 33, 36, 0.14);
    white-space: nowrap;
  }

  .art-chips span.on { background: var(--b-600); color: #fff; }

  /* keyword ∩ meaning */
  .art-venn { right: 0.9rem; bottom: 0.7rem; display: flex; align-items: center; }

  .art-venn i {
    display: block;
    width: 3.1rem; height: 3.1rem;
    border-radius: 50%;
    border: 2px solid var(--cyan-800);
    opacity: 0.55;
  }

  .art-venn i + i { margin-left: -1.4rem; border-color: var(--b-600); }

  .art-venn b {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.62rem; font-weight: 500; color: var(--cyan-800);
  }

  /* one question fanning into three searches */
  .art-fan { right: 1rem; bottom: 0.8rem; width: 5.2rem; height: 3.2rem; }
  .art-fan svg { width: 100%; height: 100%; overflow: visible; }
  .art-fan .ln { stroke: var(--b-300); stroke-width: 1.5; fill: none; }
  .art-fan .dot { fill: var(--b-600); }
  .art-fan .dot.src { fill: var(--b-800); }

  /* a page being watched: catalogue + eye + chat */
  .art-site { right: 0.8rem; bottom: 0.7rem; display: flex; align-items: center; gap: 0.5rem; }

  .as-page2 {
    width: 6.6rem;
    background: #fff;
    border-radius: 9px;
    box-shadow: 0 4px 14px rgba(32, 33, 36, 0.16);
    padding: 0.35rem;
    display: flex;
    flex-direction: column;
    gap: 0.28rem;
  }

  .as-page2 .bar { height: 5px; border-radius: 999px; background: var(--b-200); width: 70%; }
  .as-page2 .cat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.22rem; }
  .as-page2 .cat i { display: block; height: 0.95rem; border-radius: 4px; background: var(--line); }
  .as-page2 .cat i.sel { background: var(--b-300); box-shadow: 0 0 0 1.5px var(--b-600); }

  .as-eye { width: 26px; height: 26px; color: #fff; opacity: 0.95; }

  .as-chat {
    width: 2rem; height: 1.7rem;
    background: #fff;
    border-radius: 9px 9px 9px 3px;
    box-shadow: 0 4px 14px rgba(32, 33, 36, 0.18);
    display: grid;
    place-items: center;
  }

  .as-chat svg { width: 13px; height: 13px; color: var(--b-600); }

  /* nav breadcrumb */
  .art-nav { right: 0.9rem; bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.25rem; align-items: flex-end; }
  .art-nav span {
    font-size: 0.64rem;
    background: #fff;
    border-radius: 6px;
    padding: 0.18rem 0.45rem;
    box-shadow: 0 2px 8px rgba(32, 33, 36, 0.12);
    color: var(--muted);
  }
  .art-nav span.hi { background: var(--b-600); color: #fff; }

  /* the ask button, with a cursor */
  .art-btn { right: 0.8rem; bottom: 1rem; }
  .art-btn .bt {
    display: inline-block;
    font-size: 0.63rem; font-weight: 500;
    background: var(--b-600); color: #fff;
    border-radius: 999px; padding: 0.28rem 0.6rem;
    box-shadow: 0 4px 12px rgba(26, 115, 232, 0.35);
  }
  .btn-cursor {
    position: absolute;
    right: 0.2rem; bottom: -0.9rem;
    width: 24px; height: 24px;
    fill: var(--ink);
    stroke: #fff;
    stroke-width: 1.4;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.28));
  }

  /* eight clicks vs one message */
  .art-clicks { right: 0.9rem; bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.3rem; align-items: flex-end; }
  .art-clicks .row { display: flex; align-items: center; gap: 0.2rem; }
  .art-clicks .row i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
  .art-clicks .row.one i { width: 2.6rem; height: 8px; border-radius: 999px; background: var(--b-600); }
  .art-clicks .row span { font-size: 0.6rem; color: var(--muted); margin-left: 0.25rem; }

  /* last-order receipt */
  .art-receipt {
    right: 0.9rem; bottom: -0.5rem;
    width: 5.4rem;
    background: #fff;
    border-radius: 7px 7px 0 0;
    box-shadow: 0 -2px 12px rgba(32, 33, 36, 0.14);
    padding: 0.4rem 0.45rem;
    display: flex; flex-direction: column; gap: 0.22rem;
    transform: rotate(-3deg);
  }
  .art-receipt i { display: block; height: 4px; border-radius: 999px; background: var(--line); }
  .art-receipt i.s { width: 60%; }
  .art-receipt b { font-size: 0.66rem; color: var(--b-800); border-top: 1px solid var(--line); padding-top: 0.2rem; }

  /* stacked generative cards */
  .art-stack { right: 1rem; bottom: 0.8rem; width: 4.6rem; height: 3.2rem; }
  .art-stack span {
    position: absolute; left: 0; right: 0;
    height: 1.5rem;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(32, 33, 36, 0.14);
  }
  .art-stack span:nth-child(1) { top: 0; transform: rotate(-5deg) scale(0.92); }
  .art-stack span:nth-child(2) { top: 0.55rem; transform: rotate(2deg) scale(0.96); }
  .art-stack span:nth-child(3) { top: 1.15rem; background: var(--b-100); }

  /* wine + its pairing */
  .art-pair { right: 0.8rem; bottom: 0.7rem; display: flex; align-items: center; gap: 0.3rem; }

  .ap-card {
    width: 3.9rem; height: 4.3rem;
    background: #fff;
    border-radius: 9px;
    box-shadow: 0 4px 14px rgba(13, 60, 120, 0.26);
    display: grid; place-items: center;
    padding: 0.2rem;
  }

  .ap-card img { width: 100%; height: 100%; object-fit: contain; }
  .ap-plus { color: #fff; font-size: 1.15rem; opacity: 0.9; }

  /* stacked cards, light version for dark tiles */
  .art-stack.light span { background: rgba(255, 255, 255, 0.9); }
  .art-stack.light span:nth-child(3) { background: rgba(255, 255, 255, 0.55); }

  /* overlap dots */
  .art-plan { right: 1rem; bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.25rem; }
  .art-plan .row { display: flex; gap: 0.25rem; }
  .art-plan i { width: 9px; height: 9px; border-radius: 50%; background: rgba(26, 115, 232, 0.18); }
  .art-plan i.on { background: var(--b-600); }
  .v-gemini .art-plan i, .v-solid .art-plan i, .v-deep .art-plan i { background: rgba(255, 255, 255, 0.32); }
  .v-gemini .art-plan i.on, .v-solid .art-plan i.on, .v-deep .art-plan i.on { background: #fff; }

  /* ---------------- expanded sheet ---------------- */

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(13, 60, 120, 0.34);
    backdrop-filter: blur(4px);
    display: grid;
    place-items: center;
    padding: 1.5rem;
    animation: fade 0.16s ease;
  }

  .backdrop[hidden] { display: none; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.965) translateY(6px); } }

  .sheet {
    background: #fff;
    border-radius: 26px;
    width: min(52rem, 100%);
    max-height: min(84vh, 46rem);
    overflow-y: auto;
    padding: 1.7rem 1.9rem 1.9rem;
    box-shadow: 0 24px 60px rgba(13, 60, 120, 0.3);
    animation: pop 0.2s cubic-bezier(0.2, 0, 0, 1);
    position: relative;
  }

  .sheet-head { display: flex; align-items: center; gap: 0.85rem; margin-bottom: 0.4rem; }

  .sheet-head .ficon {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--b-100); color: var(--b-700);
    display: grid; place-items: center; flex: none;
  }

  .sheet-head .ficon svg { width: 22px; height: 22px; }

  .sheet-head h3 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: -0.6px;
    color: var(--ink);
  }

  .sheet-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line-2);
    background: #fff;
    color: var(--muted);
    cursor: pointer;
    display: grid; place-items: center;
    font-size: 1.1rem;
    line-height: 1;
  }

  .sheet-close:hover { background: var(--surface); color: var(--ink); }
  .sheet-close:focus-visible { outline: 2px solid var(--b-600); outline-offset: 2px; }

  .sheet .detail { display: flex; flex-direction: column; gap: 1rem; }

  .sheet .detail > p { margin: 0; font-size: 0.98rem; color: var(--ink-2); }
  .sheet .detail em { font-style: normal; color: var(--b-800); font-weight: 500; }

  /* ---------------- diagram pieces ---------------- */

  .flow { display: flex; align-items: stretch; gap: 0.4rem; flex-wrap: wrap; }

  .node {
    flex: 1 1 7rem;
    min-width: 6.5rem;
    background: var(--b-50);
    border: 0;
    border-radius: 16px;
    padding: 0.7rem 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .node .k { font-size: 0.62rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--b-700); font-weight: 500; }
  .node .v { font-size: 0.85rem; color: var(--ink); line-height: 1.3; }
  .node.strong { background: var(--b-700); }
  .node.strong .k { color: rgba(255, 255, 255, 0.75); }
  .node.strong .v { color: #fff; }

  .arrow-i {
    align-self: center;
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--b-100);
    color: var(--b-600);
    display: grid;
    place-items: center;
  }

  .arrow-i svg { width: 13px; height: 13px; }

  /* fan-out: one question, several searches, one merge */
  .fan { display: flex; flex-direction: column; gap: 0.45rem; }

  .fan-branches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 0.45rem;
    padding-left: 1.1rem;
    border-left: 2px solid var(--b-200);
    margin-left: 0.8rem;
    position: relative;
  }

  .fan-branches .node { background: #fff; border-color: var(--b-200); }

  .fan-branches::before,
  .fan-branches::after {
    content: "";
    position: absolute;
    left: -2px;
    width: 10px;
    height: 2px;
    background: var(--b-200);
  }

  .fan-branches::before { top: 0; }
  .fan-branches::after { bottom: 0; }

  /* overlap matrix */
  .matrix { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .matrix th {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 0.4rem 0.4rem;
    text-align: center;
  }
  .matrix th:first-child { text-align: left; }
  .matrix td { padding: 0.3rem 0.4rem; border-top: 1px solid var(--line); text-align: center; }
  .matrix td:first-child { text-align: left; color: var(--ink-2); }

  .cell {
    display: inline-block;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--line);
  }

  .cell.on { background: var(--b-600); }
  .cell.on.alt { background: var(--cyan); }

  /* range slider for the commercial dial */
  .range { display: flex; flex-direction: column; gap: 0.4rem; }

  .range-track {
    position: relative;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--b-100), var(--b-300), var(--b-600), var(--b-900));
  }

  .range-knob {
    position: absolute;
    top: 50%;
    left: 88%;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--b-800);
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(13, 60, 120, 0.35);
  }

  .range-scale {
    display: flex;
    justify-content: space-between;
    font-size: 0.74rem;
    color: var(--muted);
  }

  .range-scale b { color: var(--b-800); font-weight: 500; }

  /* generative UI mini cards */
  .gen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 0.5rem; }

  .gen-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 0.6rem 0.7rem 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .gen-card .bar { height: 5px; border-radius: 999px; background: var(--b-200); }
  .gen-card .bar.short { width: 55%; }
  .gen-card .bar.tall { height: 24px; border-radius: 8px; background: linear-gradient(135deg, var(--b-100), var(--b-300)); }
  .gen-card .tagname { font-family: var(--mono); font-size: 0.72rem; color: var(--b-800); }
  .gen-card .cap { font-size: 0.76rem; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }

  .chip {
    font-family: var(--mono);
    font-size: 0.73rem;
    background: var(--b-100);
    color: var(--b-800);
    border-radius: 999px;
    padding: 0.24rem 0.6rem;
  }

  .chip.cyan { background: var(--cyan-50); color: var(--cyan-800); }
  .chip.plain { background: var(--surface); color: var(--muted); }

  .rows { display: flex; flex-direction: column; gap: 0.4rem; }

  .maprow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.3fr);
    align-items: center;
    gap: 0.7rem;
    background: var(--surface);
    border-radius: 14px;
    padding: 0.55rem 0.85rem;
    font-size: 0.87rem;
  }

  .maprow .from { color: var(--ink-2); }
  .maprow .to { font-size: 0.87rem; color: var(--b-800); font-weight: 500; }
  .maprow .ar { color: var(--b-300); }

  .sift { display: flex; flex-direction: column; gap: 0.3rem; }

  .sift-row {
    display: grid;
    grid-template-columns: 1.2rem minmax(0, 1fr) auto;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.85rem;
    border-radius: 14px;
    font-size: 0.87rem;
    background: var(--surface);
  }

  .sift-row.keep { background: rgba(24, 128, 56, 0.08); }
  .sift-row.drop { background: rgba(197, 34, 31, 0.07); color: var(--muted); }
  .sift-row.drop .route { text-decoration: line-through; }
  .sift-row .mark { font-weight: 600; }
  .sift-row.keep .mark { color: var(--ok); }
  .sift-row.drop .mark { color: var(--no); }
  .route { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .code {
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.6;
    background: var(--b-900);
    color: #d7e6ff;
    border-radius: 14px;
    padding: 0.8rem 0.95rem;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .code b { color: #8ab4f8; font-weight: 500; }
  .code mark {
    background: rgba(138, 180, 248, 0.16);
    color: #d7e6ff;
    border-left: 2px solid #8ab4f8;
    padding-left: 0.35rem;
    display: block;
    margin: 0.1rem 0;
  }
  .code i { color: #78d9ec; font-style: normal; }

  /* mini UI mockups */

  .mock {
    background: var(--surface);
    border: 0;
    border-radius: 18px;
    padding: 0.8rem;
    display: flex;
    gap: 0.55rem;
    overflow-x: auto;
  }

  .mock-card {
    flex: 1 1 0;
    min-width: 8rem;
    background: #fff;
    border: 0;
    border-radius: 14px;
    box-shadow: 0 1px 4px rgba(32, 33, 36, 0.08);
    padding: 0.55rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .mock-img {
    height: 62px;
    width: 100%;
    object-fit: contain;
    border-radius: 8px;
    background: #fff;
  }

  .mini {
    height: 26px;
    width: 26px;
    object-fit: contain;
    vertical-align: -0.45em;
    margin-right: 0.25rem;
  }

  .matrix .mark { font-weight: 600; }
  .matrix .mark.yes { color: var(--ok); }
  .matrix .mark.no { color: var(--no); }

  .mock-card .t { font-size: 0.75rem; line-height: 1.25; color: var(--ink); }
  .mock-card .pz { font-size: 0.8rem; color: var(--b-800); font-weight: 500; }
  .mock-card .btn {
    font-size: 0.68rem;
    background: var(--b-600);
    color: #fff;
    border-radius: 999px;
    padding: 0.2rem 0.5rem;
    text-align: center;
  }

  .mock-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .mock-table th, .mock-table td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid var(--line); }
  .mock-table th { font-weight: 500; color: var(--b-800); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .mock-table td:first-child { color: var(--muted); font-size: 0.75rem; }

  .note {
    font-size: 0.88rem;
    color: var(--muted);
    background: var(--surface);
    border-radius: 14px;
    padding: 0.6rem 0.9rem;
    margin: 0;
  }

  .dial { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .dial span {
    font-size: 0.78rem;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 0.22rem 0.65rem;
    color: var(--muted);
    background: #fff;
  }
  .dial span.on { background: var(--b-700); border-color: transparent; color: #fff; font-weight: 500; }

  /* ---------------- closing ---------------- */

  .closing-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; }

  .closing-card {
    border-radius: 20px;
    padding: 1.2rem 1.3rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    position: relative;
    overflow: hidden;
  }

  .closing-card .when { font-size: 0.72rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; }
  .closing-card b { font-size: 1.1rem; font-weight: 500; }
  .closing-card p { margin: 0; font-size: 0.88rem; line-height: 1.4; opacity: 0.9; }

  .closing-card { border-radius: 24px; }
  .c-now { background: var(--b-100); color: var(--b-900); }
  .c-next { background: var(--b-600); color: #fff; }
  .c-then {
    background: linear-gradient(118deg, #1a73e8 0%, #4285f4 26%, #9b72cb 56%, #d96570 82%, #f9ab00 100%);
    color: #fff;
  }
  .c-then::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(13, 60, 120, 0.4), transparent 62%);
  }
  .c-then > * { position: relative; z-index: 1; }

  .nextup { padding: 0.2rem 0 0; }

  .nextup .lbl { color: var(--b-700); }

  .next-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    background: #fff;
    color: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.32rem 0.85rem;
    box-shadow: 0 1px 4px rgba(32, 33, 36, 0.06);
  }

  .next-chip svg { width: 15px; height: 15px; flex: none; color: var(--muted); }
  .next-chip.solid { background: var(--b-600); border-color: transparent; color: #fff; }
  .next-chip.solid svg { color: #fff; }


  .next-chip.grad svg { color: var(--b-600); }

  .next-chip.grad {
    border-color: transparent;
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(112deg, #34a853, #12b5cb 22%, #4285f4 48%, #9b72cb 70%, #f9ab00) border-box;
    border-width: 1.5px;
    font-weight: 500;
    color: var(--ink);
  }

  .banner {
    border-radius: 20px;
    padding: 1.3rem 1.5rem;
    background: linear-gradient(100deg, rgba(66,133,244,0.14), rgba(155,114,203,0.13) 45%, rgba(217,101,112,0.12) 72%, rgba(249,171,0,0.14));
  }

  .banner p { margin: 0; font-size: clamp(1.05rem, 1.9vw, 1.3rem); letter-spacing: -0.3px; max-width: 42ch; }

  .kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 0.7rem; }
  .kit-item { background: var(--surface); border-radius: 18px; padding: 0.85rem 1.05rem; }
  .kit-item p { margin: 0 0 0.4rem; font-size: 0.9rem; color: var(--ink-2); }
  .kit-item p:last-child { margin-bottom: 0; }
  .kit-item b { font-weight: 500; }

  .lbl {
    display: block;
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 0.4rem;
  }

  /* ---------------- notes ---------------- */

  .notes {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--surface);

    color: var(--b-900);
    border-radius: 12px;
    padding: 0.55rem 0.7rem;
    box-shadow: 0 6px 20px rgba(13, 60, 120, 0.24);
    white-space: pre;
    overflow: hidden;
  }
  .mini-code b { color: var(--b-600); font-weight: 500; }

  /* journeys: numbered steps with the agent that owns each one */
  .route { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem; }
  .route span {
    font-family: var(--mono);
    font-size: 0.66rem;
    background: var(--b-100);
    color: var(--b-800);
    border-radius: 999px;
    padding: 0.14rem 0.5rem;
  }
  .route em { font-style: normal; font-size: 0.72rem; color: var(--b-400); }
  .v-gemini .route span, .v-solid .route span, .v-deep .route span { background: rgba(255, 255, 255, 0.22); color: #fff; }
  .v-gemini .route em, .v-solid .route em, .v-deep .route em { color: rgba(255, 255, 255, 0.7); }

  .steps { list-style: none; margin: 0.15rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
  .steps li {
    display: grid;
    grid-template-columns: 1.35rem minmax(0, 1fr);
    gap: 0.5rem;
    align-items: start;
    font-size: 0.88rem;
    line-height: 1.4rem;
  }
  .steps li > b {
    font-size: 0.7rem; font-weight: 500;
    width: 1.35rem; height: 1.35rem; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--b-100); color: var(--b-800);
    margin-top: 0.025rem;
    line-height: 1;
  }
  .steps li.key > b { background: var(--b-600); color: #fff; }
  .steps li.key span { font-weight: 500; }
  .v-gemini .steps li > b, .v-solid .steps li > b { background: rgba(255, 255, 255, 0.24); color: #fff; }
  .v-gemini .steps li.key > b, .v-solid .steps li.key > b { background: #fff; color: var(--b-800); }

  .proves {
    font-size: 0.78rem;
    border-top: 1px solid rgba(26, 115, 232, 0.16);
    padding-top: 0.45rem;
    opacity: 0.9;
  }
  .proves b { font-weight: 500; }
  .v-gemini .proves, .v-solid .proves { border-top-color: rgba(255, 255, 255, 0.28); }

  /* edge cases: what I do, what must happen */
  .io { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 0.3rem 0.6rem; margin: 0.1rem 0 0; font-size: 0.86rem; line-height: 1.32; }
  .io dt {
    font-size: 0.64rem; font-weight: 500; letter-spacing: 0.7px; text-transform: uppercase;
    opacity: 0.7; padding-top: 0.15rem;
  }
  .io dd { margin: 0; }

  /* hill-climbing story */
  .story { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; margin-top: 0.3rem; }
  .story > div { background: var(--b-50); border-radius: 16px; padding: 0.65rem 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; }
  .story > div:nth-child(2) { background: var(--b-100); }
  .story > div:nth-child(3) { background: var(--b-700); color: #fff; }
  .story .k { font-size: 0.64rem; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--b-700); }
  .story > div:nth-child(3) .k { color: rgba(255, 255, 255, 0.75); }
  .story p { margin: 0; font-size: 0.84rem !important; line-height: 1.35; opacity: 1 !important; }

  /* score progression */
  .climb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; height: 9.5rem; margin-top: 0.4rem; }
  .cb { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 0.15rem; }
  .cb .col { position: relative; }
  .cb .col i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 10px 10px 4px 4px; background: rgba(255, 255, 255, 0.34); }
  .cb.on .col i { background: #fff; }
  .cb b { font-size: 1.15rem; font-weight: 500; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; }
  .cb span { font-size: 0.72rem; opacity: 0.85; }

  /* demo slide: more room, bigger type */
  .bento.demo .tile { padding: 0.9rem 1rem 1rem; gap: 0.55rem; }
  .bento.demo .tile h3 { font-size: 1.3rem; letter-spacing: -0.4px; }
  .bento.demo .steps { gap: 0.5rem; }
  .bento.demo .steps li { font-size: 0.98rem; }
  .bento.demo .proves { font-size: 0.86rem; }

  /* hard questions: the question reads first */
  .kit-item .qq { font-size: 0.95rem; font-weight: 500; color: var(--ink); margin-bottom: 0.35rem; }

  /* roadmap waves */
  .wave-list { margin: 0.2rem 0 0; padding-left: 1.05rem; display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.88rem; line-height: 1.32; }
  .tile .wave-list li { opacity: 0.9; }

  /* code comments inside sheets */
  .code .cm { color: #9fb3d1; }
  .matrix code, .sheet code, .tile code { font-family: var(--mono); font-size: 0.85em; }

  /* ---------------- presenter notes: same visual language, more room ---------------- */

  .notes { max-height: 36vh; }
  body.notes-big .notes { max-height: 70vh; }

  .notes .col { display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }
  .nb { display: flex; flex-direction: column; gap: 0.35rem; }
  .nb .lbl { margin-bottom: 0.1rem; }
  .lbl .t { color: var(--b-700); margin-left: 0.35rem; }

  .say p b, .nb p b { color: var(--ink); font-weight: 500; }
  .nb p { margin: 0; font-size: 0.86rem; line-height: 1.45; color: var(--ink-2); }
  .nb ul { margin: 0; padding-left: 1.05rem; display: flex; flex-direction: column; gap: 0.28rem; }
  .nb li { font-size: 0.86rem; line-height: 1.45; color: var(--ink-2); }
  .nb li b { color: var(--ink); font-weight: 500; }
  .nb code, .say code, .line code { font-family: var(--mono); font-size: 0.8em; color: var(--b-800); }

  /* the "for you" column: calmer card */
  .foryou {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0.75rem 0.95rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .ask p.q { color: var(--ink); font-weight: 500; }
  .ask p.q + p { margin-bottom: 0.2rem; }

  .line .t { word-break: break-word; }
  .line.act .t { font-style: normal; }

  /* ---------------- presenter window ---------------- */
  .clock {
    display: none;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 0.36rem 0.8rem;
    cursor: pointer;
  }
  body.presenter .clock { display: inline-flex; }
  .topbar { display: flex; gap: 0.4rem; align-items: center; }
  body.presenter .notes { max-height: 58vh; }
  body.presenter.notes-big .notes { max-height: 76vh; }

  .keys { font-size: 0.72rem; color: var(--faint); }
  .keys b { font-weight: 500; color: var(--muted); }

  @media (max-width: 64rem) {
    .split { grid-template-columns: minmax(0, 1fr); }
    .bars { width: 100%; }
    .story { grid-template-columns: minmax(0, 1fr); }
    .dod { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rung { grid-template-columns: 2rem minmax(0, 1fr); }
    .rung i { grid-column: 2; }
  }

<script>
(function () {
  var PACK = { es: [{"name": "Portada", "private": false, "kit": "", "notes": "<footer class=\"notes\"><div class=\"notes-inner\">\n      <div class=\"col\">\n        <div class=\"nb say\">\n          <span class=\"lbl\">Qué digo <span class=\"t\">0:00 a 0:15</span></span>\n          <p>“Hola, soy Ras. Os voy a enseñar el agente de voz que he construido para Telco Voice Central, la línea de atención al cliente de una operadora.”</p>\n          <p>“Voy en este orden: el contexto del cliente y el objetivo, cómo está construido, una demo en directo con recorridos principales y casos límite, las evaluaciones de calidad y cómo lo llevaría a producción. Al final, preguntas.”</p>\n        </div>\n        <div class=\"nb\">\n          <span class=\"lbl\">Antes de compartir pantalla</span>\n          <ul>\n            <li>Pulsa <b>P</b>: se abre la ventana de presentador con estas notas. Comparte <b>solo la otra ventana</b> y en ella pulsa <b>N</b> para ocultar las notas.</li>\n            <li>Pestañas listas: simulador de CES con el agente, <code>tdd.md</code>, <code>app.json</code> y la carpeta <code>eval-reports/</code>.</li>\n            <li>Ten a mano la diapositiva “Chuleta de demo” (solo la ves tú).</li>\n          </ul>\n        </div>\n      </div>\n      <div class=\"col foryou\">\n        <div class=\"nb\">\n          <span class=\"lbl\">Para ti: qué te están evaluando</span>\n          <ul>\n            <li><b>Tres notas del 1 al 5:</b> fiabilidad en producción, criterio de diseño (herramientas, descomposición, seguridad) y velocidad con buen juicio (casos límite, mantenibilidad).</li>\n            <li><b>Cinco bloques obligatorios</b>, y el deck va en ese orden: problema, arquitectura, demo, calidad, roadmap. Si falta uno, la nota tiene techo.</li>\n            <li><b>Regla de oro de tiempo:</b> si vas justo, recorta la demo, nunca calidad ni roadmap. Prefieren los cinco bloques breves que cuatro largos.</li>\n          </ul>\n        </div>\n        <div class=\"nb\">\n          <span class=\"lbl\">Reparto de tiempo (guía de evaluación)</span>\n          <ul>\n            <li><b>0:00 a 1:30</b> · Contexto, impacto y definición de terminado (diap. 1 y 2)</li>\n            <li><b>1:30 a 6:30</b> · Arquitectura y seguridad (diap. 3 y 4)</li>\n            <li><b>6:30 a 11:00</b> · Demo: recorridos y casos límite (diap. 5 y 6)</li>\n            <li><b>11:00 a 17:00</b> · Calidad y mejora iterativa (diap. 7 y 8)</li>\n            <li><b>17:00 a 21:00</b> · Roadmap (diap. 9)</li>\n            <li><b>21:00 a 30:00</b> · Cierre y preguntas</li>\n          </ul>\n        </div>\n        <div class=\"nb\">\n          <span class=\"lbl\">Atajos</span>\n          <p class=\"keys\"><b>← →</b> cambiar · <b>N</b> notas · <b>E</b> notas grandes · <b>P</b> ventana de presentador · clic en una tarjeta para ver el detalle</p>\n        </div>\n      </div>\n    </div></footer>"}, {"name": "1 · Contexto", "private": false, "kit": "", "notes": "<footer class=\"notes\"><div class=\"notes-inner\">\n      <div class=\"col\">\n        <div class=\"nb say\">\n          <span class=\"lbl\">Qué digo <span class=\"t\">0:15 a 0:55</span></span>\n          <p>“El cliente es Telco, una operadora de telecomunicaciones de consumo. El encargo: automatizar su <b>línea principal de atención por voz</b>.”</p>\n          <p class=\"cue\"><b>Señala las barras.</b></p>\n          <p>“Seis motivos concentran el volumen. <b>Soporte técnico y facturación suman el 55%</b>; después ventas y cuenta, citas y cambios de servicio.”</p>\n          <p class=\"cue\"><b>Señala el 85%.</b></p>\n          <p>“El dato que más condiciona el diseño: <b>el 85% de las llamadas exige verificar la identidad</b> antes de hacer nada. No es un FAQ: son pagos, reembolsos, bajas y cambios de seguridad.”</p>\n          <p>“Además los clientes llaman en inglés y en francés canadiense, y hay llamadas que cruzan áreas, como reactivar una línea que exige pagar antes.”</p>\n          <p>“Y abajo tenéis las cinco reglas de oro del negocio: aviso de grabación literal, leer solo los últimos 4 dígitos de cualquier dato privado, las cuentas de empresa van siempre a una persona, <b>el fraude se transfiere a un humano inmediatamente sin pedir PIN</b>, y por eso mismo <b>las colas humanas de averías y fraude son las únicas abiertas 24/7</b>.”</p>\n        </div>\n      </div>\n      <div class=\"col foryou\">\n        <div class=\"nb\">\n          <span class=\"lbl\">Para entenderlo · Estudio a fondo (de menos a más)</span>\n          <ul>\n            <li><b>1. En lenguaje llano (El problema real del cliente):</b> Telco recibe miles de llamadas por 6 motivos (soporte técnico, facturación, ventas, gestión de cuenta, citas y cambios de servicio). El gran reto no es responder dudas generales (\"¿Cuál es el horario?\"), sino que <b>el 85% de las llamadas exigen tocar la cuenta real del cliente</b> (pagar facturas, emitir reembolsos, suspender o reactivar líneas, cambiar PIN/MFA). Eso obliga a identificar y autenticar antes de mover un dedo.</li>\n            <li><b>2. De dónde salen las dos cifras clave del slide (85% y 55%):</b>\n              <br>• <b>El 85% (Autenticación obligatoria):</b> En el documento de requisitos (PRD/brief), los 6 motivos suman el 100% del tráfico: Soporte técnico (30%) + Facturación (25%) + Ventas (15%) + Cuenta (15%) + Citas (10%) + Cambios (5%). Todos exigen autenticación obligatoria salvo Ventas (15%), donde un cliente nuevo puede preguntar precios sin tener cuenta. Por tanto: <code>100% - 15% = 85%</code>.\n              <br>• <b>El 55% (Concentración de negocio):</b> Soporte técnico (30%) + Facturación (25%) = <b>55% de todas las llamadas</b>. Más de la mitad del call center vive en esos dos problemas. Si automatizas bien esos dos bloques, le ahorras a Telco más de la mitad de su carga operativa.</li>\n            <li><b>3. ¡Duda clave resuelta! ¿Por qué `Fraude: a un humano sin autenticar` y qué tiene que ver con `Averías y fraude: colas 24/7`? (Las dos mitades de la misma regla):</b>\n              <br>• <b>Mitad A · ¿Por qué en Fraude está PROHIBIDO autenticar con PIN u OTP?</b>\n              <br>&nbsp;&nbsp;— <i>Imagina la situación real:</i> A María le acaban de robar el móvil en el metro o un hacker ha entrado en su cuenta de Telco y le ha cambiado el PIN. María llama desesperada desde el teléfono de un amigo diciendo: <i>\"¡Me han hackeado la cuenta!\"</i>.\n              <br>&nbsp;&nbsp;— <i>¿Qué pasaría si el robot le pidiera el PIN o le mandara un SMS OTP?</i> Que el SMS le llegaría **al móvil que tiene el ladrón en la mano**, y el PIN nuevo solo lo sabe el ladrón. La víctima real jamás pasaría el filtro del robot. Y al revés: si el que llama es el estafador intentando tantear la cuenta, pedirle el PIN en un sistema automático le daría pistas gratis.\n              <br>&nbsp;&nbsp;— <i>La regla en nuestro agente:</i> Aunque el 85% de las llamadas normales exigen PIN/OTP, en cuanto el cliente pronuncia \"fraude / hackeo / robo / cargo no autorizado\", el robot **salta por encima del PIN** y ejecuta `execute_live_agent_handover(reason=\"fraud_report\")` en ese mismo segundo para que un especialista humano de Seguridad bloquee la línea verificando su DNI/pasaporte.\n              <br>• <b>Mitad B · ¿Y qué significa `Averías y fraude: colas 24/7`?</b>\n              <br>&nbsp;&nbsp;— En el Call Center de Telco (según el PRD), **los agentes humanos NO trabajan a todas horas en todos los departamentos**: las colas humanas de *Facturación*, *Ventas*, *Citas* y *Bajas* tienen horario comercial (por ejemplo, de 08:00 a 22:00). Si llamas a las 3:30 de la madrugada para disputar una factura de 80$, no hay humanos de Facturación despiertos.\n              <br>&nbsp;&nbsp;— **PERO hay dos colas de humanos que NUNCA cierran (están abiertas 24 horas, 7 días a la semana = `24/7`):** la cola de **Fraude/Seguridad** y la cola de **Averías Técnicas**.\n              <br>&nbsp;&nbsp;— *¿Cómo se conectan las dos pastillas?* Como el robot tiene prohibido resolver casos de fraude por su cuenta (`Fraude: a un humano sin autenticar`), Telco garantiza que **la cola humana de Fraude y Averías está abierta 24/7** (`Averías y fraude: colas 24/7`). Así, aunque te roben el móvil un domingo a las 4 de la mañana, el traspaso inmediato del robot siempre encuentra a un agente humano despierto al otro lado.</li>\n            <li><b>4. Las otras 3 reglas legales de la barra inferior:</b>\n              <br>• <b>Aviso de grabación literal:</b> Por ley de telecomunicaciones, si el cliente interrumpe el saludo al principio, el robot está obligado a volver a decir <i>\"This call may be recorded for quality and training purposes\"</i> antes de seguir.\n              <br>• <b>Solo últimos 4 dígitos (PCI/PII):</b> Como el 100% de las llamadas se graban, si el robot leyera los 16 dígitos de una tarjeta o un PIN completo en voz alta, quedaría grabado en el audio y violaría la normativa bancaria PCI-DSS.\n              <br>• <b>Cuentas de empresa (Business) van a humano:</b> Cuando `fetch_customer_profile` devuelve `account_type == \"BUSINESS\"`, el agente transfiere inmediatamente a un gestor corporativo humano porque las empresas tienen contratos y penalizaciones (SLAs) a medida.</li>\n          </ul>\n        </div>\n        <div class=\"nb\">\n          <span class=\"lbl\">El valor en la evaluación · Dónde hacer hincapié y qué justifica cada frase para después</span>\n          <p>En la rúbrica (Sección 1.1), el evaluador busca comprobar que <b>no pusiste callbacks, guardas ni sub-agentes por capricho</b>, sino porque cada dato de negocio de esta Diapositiva 1 te obligó a tomar una decisión técnica que vas a enseñar en las siguientes slides. <b>Haz hincapié en estos 7 puntos al hablar porque cada uno \"siembra\" lo que vas a justificar luego:</b></p>\n          <ul>\n            <li><b>1. Siembra el `85% exige autenticar` → Para justificar luego tus Guardas en Python (`Slide 4` y `Slide 8`):</b>\n              <br><i>Por qué recalcarlo ahora:</i> Di con fuerza que <i>\"casi 9 de cada 10 llamadas tocan dinero o datos privados\"</i>. Así, cuando llegues a Seguridad (Slide 4) y al Bug del `and` (Slide 8), podrás decir: <i>\"¿Recordáis que el 85% exigía autenticar? Por eso no podíamos dejar la seguridad en el prompt: metimos `if auth_status != 'Pass'` en el código Python de cada tool y un segundo código OTP fresco (`step_up_status`) para el MFA.\"</i></li>\n            <li><b>2. Siembra el `55% en Soporte (30%) y Facturación (25%)` → Para justificar las 8 reglas de reembolso (`Slide 4`) y el orden del Roadmap (`Slide 9`):</b>\n              <br><i>Por qué recalcarlo ahora:</i> Señala que más de la mitad del call center son facturas y averías. Eso justifica dos cosas después: (1) por qué blindaste `refund_duplicate_payment` con 8 comprobaciones deterministas y tope de 25$/50$, y (2) por qué en el Roadmap (Slide 9) la **Ola 2** empieza conectando Soporte Técnico (el 30% del volumen) y no otro departamento.</li>\n            <li><b>3. Siembra las `Llamadas entre áreas` (reactivar exige pagar) → Para justificar el Multi-Agente + `context.state` + `transferRules` (`Slide 3` y `Demo A`):</b>\n              <br><i>Por qué recalcarlo ahora:</i> Menciona que el cliente llama para reactivar su línea y descubre que debe 45$. Eso prepara tu argumento estrella de Arquitectura (Slide 3): <i>\"Por culpa de estas llamadas cruzadas no servía un árbol rígido ni agentes aislados: diseñamos 1 Root + 4 Especialistas que se pasan la mochila `context.state` (para no pedir el PIN dos veces) y usamos una `transferRule` determinista (`flag_val == 'balance_owed_redirect'`) que mueve la llamada de Cuenta a Facturación sin depender del LLM.\"</i></li>\n            <li><b>4. Siembra la `Clientela bilingüe` (inglés y francés) → Para justificar `bargeInAwareness` y la Regla de 3 palabras (`Slide 6 · Caso Límite 1`):</b>\n              <br><i>Por qué recalcarlo ahora:</i> Al mencionar que hablan en inglés y francés por teléfono, preparas el terreno para enseñar en la Demo de Casos Límite por qué creaste la **regla de las 3 palabras** en `global_instruction.txt` y la tool `update_language`: para que un simple *\"Excusez-moi\"* o ruido al interrumpir el saludo no cambie por error toda la llamada al francés.</li>\n            <li><b>5. Siembra el `Aviso de grabación literal` y frases obligatorias → Para justificar tus 2 Callbacks (`after_model_callback` y `before_model_callback` en `Slide 4` y `Slide 6`):</b>\n              <br><i>Por qué recalcarlo ahora:</i> Subraya la palabra **\"literal\"**. Cuando el evaluador te vea en la Slide 4 enseñar `after_model_callback`, entenderá al instante por qué existe ese código: como el LLM es generativo y a veces cambia una palabra al despedirse, el `after_model_callback` intercepta `llm_response.content.parts`, pisa el texto del modelo con la frase legal **exacta carácter por carácter** e inyecta `end_session` en el mismo turno para que la llamada se corte limpia.</li>\n            <li><b>6. Siembra `Datos personales: solo últimos 4 dígitos` → Para justificar el truncado en Python + `redactionConfig` + `DTMF` (`Slide 4` y `Slide 9`):</b>\n              <br><i>Por qué recalcarlo ahora:</i> Recuerda que todas las llamadas se graban. Eso justifica tu triple escudo de privacidad posterior: (1) las tools Python solo devuelven los últimos 4 dígitos (`…4242`) para que el LLM jamás pueda pronunciar la tarjeta entera; (2) en `app.json` activaste `redactionConfig.enableRedaction: true` para censurar logs; y (3) en el Roadmap (Slide 9) metiste teclado telefónico **DTMF** para que en producción la tarjeta se teclee y nunca se hable.</li>\n            <li><b>7. Siembra `Fraude sin autenticar` + `Averías y fraude: colas 24/7` → Para justificar el bypass de PIN en fraude (`Slide 6`) y el Horario de Colas Pre-Llamada (`Slide 9`):</b>\n              <br><i>Por qué recalcarlo ahora:</i> Explica que al denunciar fraude no se pide PIN (porque el ladrón tiene el móvil) y que por eso mismo la cola humana de Fraude y Averías es 24/7. Eso conecta directo con la **Ola 2 del Roadmap (Slide 9)**: comprobar el horario comercial antes de transferir a Facturación/Ventas (08:00–22:00), mientras que Fraude y Averías pasan en directo a cualquier hora de la madrugada.</li>\n          </ul>\n        </div>\n        <div class=\"nb ask\">\n          <span class=\"lbl\">Si te preguntan</span>\n          <p class=\"q\">“¿Y el español? ¿Por qué mencionas inglés y francés canadiense?”</p>\n          <p>“El brief de Telco exige inglés como idioma principal y francés canadiense (<code>fr-CA</code>) como idioma secundario evaluado en los tests oficiales. Además, nuestro agente tiene configurada la voz y reglas para español (<code>es-US</code>), por lo que soporta los tres idiomas sin cambiar de sesión.”</p>\n        </div>\n      </div>\n    </div></footer>"}, {"name": "2 · Impacto y objetivo", "private": false, "kit": "", "notes": "<footer class=\"notes\"><div class=\"notes-inner\">\n      <div class=\"col\">\n        <div class=\"nb say\">\n          <span class=\"lbl\">Qué digo <span class=\"t\">0:55 a 1:30</span></span>\n          <p>“El impacto que busca Telco: que <b>al menos el 60% de las llamadas las resuelva el agente de voz de principio a fin sin pasar a una persona</b>, y en menos de 4 minutos de media. Es decir: de cada 10 llamadas repetitivas, 6 se cierran solas y así <b>liberamos a los operadores humanos</b> para que atiendan los casos complejos, como fraudes o empresas.”</p>\n          <p>“Para que eso sea verdad hay siete recorridos críticos, uno por motivo de llamada más el idioma secundario. El más complejo es el 6: reactivar una línea suspendida por impago, porque cruza cuenta y facturación.”</p>\n          <p class=\"cue\"><b>Señala la franja azul.</b></p>\n          <p>“Y mi definición de terminado mezcla negocio y riesgo: 60% de contención y 4 minutos, pero también <b>al menos un 90% de acierto en los siete recorridos</b>, 100% de frases legales literales, cero fugas de datos personales y todas las llamadas grabadas. Si una de estas falla, no sale a producción.”</p>\n        </div>\n      </div>\n      <div class=\"col foryou\">\n        <div class=\"nb\">\n          <span class=\"lbl\">Para entenderlo · Estudio a fondo (de menos a más)</span>\n          <ul>\n            <li><b>1. En lenguaje llano (Qué es \"Contención\" y qué es \"AHT\"):</b>\n              <br>• <b>Contención (Containment Rate, objetivo ≥ 60%):</b> De cada 100 personas que llaman a Telco, cuántas cuelgan con su problema 100% resuelto por el robot sin haber tenido que hablar con un telefonista humano. Esa es la métrica que ahorra millones de euros al cliente.\n              <br>• <b>Duración media / AHT (Average Handle Time, objetivo ≤ 4 min):</b> Cuánto dura la llamada de media. Si el robot resuelve la llamada pero tarda 15 minutos dando vueltas, el cliente se desespera y el coste de telefonía/inferencia se dispara.</li>\n            <li><b>2. Analogía cotidiana (El médico de urgencias vs. el triaje inteligente):</b>\n              <br>• Imagina la puerta de un hospital. Si el triaje automático resuelve el 60% de las consultas rápidas (recetas, citas, curas leves) en menos de 4 minutos, los médicos humanos quedan libres para operar los casos graves.\n              <br>• Pero <b>contener NO es cerrar la puerta con llave</b>: si llega alguien con un infarto (en Telco: fraude, cuenta de empresa o disputa de 150$), el éxito NO es intentar curarlo en la puerta, sino meterlo al quirófano humano en 5 segundos.</li>\n            <li><b>3. Repetición desde otro ángulo (Por qué la \"Definición de Terminado\" mezcla negocio y seguridad):</b>\n              <br>• Un ingeniero junior diría: \"El agente está listo cuando acierta el 90% de las preguntas\".\n              <br>• Un ingeniero FDE de producción dice: \"Aunque acierte el 90% de las preguntas y contenga el 60% de las llamadas, <b>si en 1 sola llamada lee una tarjeta de crédito entera (fuga PII) o se olvida del aviso legal de grabación, NO puede salir a producción</b>\". Por eso la franja inferior tiene 6 candados simultáneos (<code>≥60%</code> contención, <code>≤4 min</code>, <code>≥90%</code> acierto en CUJs, <code>100%</code> frases legales, <code>0</code> fugas PII, <code>100%</code> grabadas).</li>\n            <li><b>4. Cómo conectamos esta slide con lo que hemos construido (CCAI Insights + Scorecards):</b>\n              <br>• En pre-producción (hoy), medimos ese <code>≥90%</code> con <b>Agent Academy (92/100 global, 96.7% en ocultos)</b> y con nuestro <b>Golden Set (5/5 = 100%)</b>.\n              <br>• En producción (mañana, con llamadas reales), ¿quién vigila esos 6 números cada noche? Nuestras reglas automáticas en <b>CCAI Insights</b> (<code>autolabel_rules.yaml</code>, el Scorecard <code>14726924315284849879</code> y <code>dashboards.yaml</code>), que etiquetan cada llamada real como <code>contained: true/false</code> y auditan las 5 preguntas de calidad.</li>\n          </ul>\n        </div>\n        <div class=\"nb\">\n          <span class=\"lbl\">Cuidado (Distinción clave ante el jurado)</span>\n          <p>El <b>60% de contención y ≤4 min</b> son los <b>objetivos de negocio en producción</b> acordados con Telco. Lo que <b>ya hemos medido y demostrado hoy</b> es el <b>92% (92/100)</b> en la suite de certificación de Agent Academy (con 96.7% en los 30 casos secretos).</p>\n        </div>\n        <div class=\"nb ask\">\n          <span class=\"lbl\">Si te preguntan</span>\n          <p class=\"q\">“¿Cómo se calcula exactamente la contención en producción dentro de CCAI Insights?”</p>\n          <p>“Con nuestra regla número 1 de <code>autolabel_rules.yaml</code>: toda llamada que termina sin haber invocado la herramienta <code>execute_live_agent_handover</code> ni tener sentimiento negativo extremo se etiqueta automáticamente con <code>contained = true</code>. Dividimos esas llamadas entre el volumen total diario en el Dashboard ejecutivo.”</p>\n        </div>\n      </div>\n    </div></footer>"}, {"name": "3 · Arquitectura", "private": false, "kit": "", "notes": "<footer class=\"notes\"><div class=\"notes-inner\">\n      <div class=\"col\">\n        <div class=\"nb say\">\n          <span class=\"lbl\">Qué digo <span class=\"t\">1:30 a 4:00</span></span>\n          <p class=\"cue\"><b>Señala el diagrama.</b></p>\n          <p>“La arquitectura es <b>en estrella</b>, lo que se conoce como hub and spoke. Un agente raíz recibe la llamada: da el aviso de grabación, identifica al cliente, detecta el idioma y enruta. Debajo, cinco especialistas: facturación, soporte técnico, ventas, citas y gestión de cuenta.”</p>\n          <p>“¿Por qué seis agentes y no uno? Con datos: <b>cada agente lee entre 1.600 y 2.300 palabras de instrucciones</b> y entre 9 y 17 herramientas. Si lo juntara todo en un único agente, leería <b>unas 6.500 palabras y las 32 herramientas en cada turno</b>: entre tres y cuatro veces más. Ahí es donde las reglas se pisan y el modelo elige mal la herramienta; es lo que se llama <b>instruction rot</b>. Divididos, cada prompt es corto y se puede probar por separado.”</p>\n          <p>“Los especialistas no tienen hijos, así que el árbol no puede tener ciclos. Si el cliente cambia de tema, vuelve al raíz y el raíz decide.”</p>\n          <p>“Lo que sí viaja entre agentes es el <b>estado de sesión</b>. Si ya te has autenticado, ningún especialista te vuelve a pedir el PIN.”</p>\n          <p>“Y los traspasos críticos <b>no los decide el modelo</b>: son reglas deterministas que leen ese estado. Lo vais a ver en la demo.”</p>\n          <p>“Y todo está documentado en el diseño técnico, que coincide con lo desplegado, y versionado en Git.”</p>\n        </div>\n      </div>\n      <div class=\"col foryou\">\n        <div class=\"nb\">\n          <span class=\"lbl\">Para entenderlo · Estudio a fondo (de menos a más)</span>\n          <ul>\n            <li><b>1. En lenguaje llano (Por qué 5 agentes en árbol y qué es \"Instruction Rot\"):</b>\n              <br>• Cuando metes demasiadas reglas y herramientas en un solo agente (por ejemplo, 6.500 palabras de prompt y 28 herramientas), ocurre lo que en ingeniería de LLMs se llama <b>\"Instruction Rot\" (pudrición de instrucciones)</b>: el modelo empieza a ignorar reglas de la mitad del texto o llama a la herramienta equivocada porque se parecen entre sí.\n              <br>• ¿Cómo lo evitamos? Partiendo ese bloque de 6.500 palabras en <b>un Recepcionista (Root) y 4 Especialistas</b> (Facturación, Soporte Técnico, Ventas/Equipos, Cuenta/Citas). Así, ningún especialista tiene que leer más de ~2.400 palabras ni ver más de 9 herramientas a la vez.</li>\n            <li><b>2. Analogía cotidiana (El hospital con historias clínicas digitales):</b>\n              <br>• El <b>Recepcionista (Root Agent)</b> está en la entrada del hospital: te saluda, te lee el aviso legal de grabación, te pide tu número de cuenta (te identifica con <code>fetch_customer_profile</code>) y mira si eres una empresa o denuncias fraude. Pero el recepcionista NO opera corazones ni cobra facturas.\n              <br>• Te envía al <b>Especialista adecuado</b>. ¿Y por qué el especialista no te vuelve a preguntar quién eres ni te vuelve a pedir el PIN? Porque tu pulsera digital (el diccionario <code>context.state</code> de CES) viaja contigo de habitación en habitación. Si <code>auth_status = \"Pass\"</code> ya está puesto en tu pulsera, todos los médicos del hospital lo ven al instante.</li>\n            <li><b>3. Repetición técnica (Qué se hereda y qué NO se hereda en CES — ¡Pregunta trampa clásica!):</b>\n              <br>• <b>¿Qué SÍ ven todos los agentes automáticamente?</b> El fichero <code>global_instruction.txt</code> (987 palabras con las leyes universales: idioma, regla de 3 palabras, prohibición de pedir OTP sin enviarlo, trato ante insultos/fraude) y la memoria de sesión (<code>context.state</code>).\n              <br>• <b>¿Qué NO heredan los especialistas del Root Agent?</b> Ni el prompt particular del Root (<code>Root_agent/instruction.txt</code>) ni sus herramientas (<code>tools</code>). Por eso cada especialista tiene declaradas en su propio JSON las herramientas transversales que puede necesitar sin volver atrás: <code>validate_authentication_pin</code>, <code>validate_authentication_otp</code>, <code>execute_live_agent_handover</code> y <code>end_session</code>.</li>\n            <li><b>4. Cómo funcionan los traspasos deterministas (<code>transferRules</code> vs. LLM):</b>\n              <br>• Cuando el especialista de Cuenta intenta reactivar una línea (<code>execute_suspend_restore</code>) y descubre que el cliente debe 45$, el código Python escribe en la memoria: <code>context.state[\"flag_val\"] = \"balance_owed_redirect\"</code>.\n              <br>• En el archivo JSON del agente hay una <b>Regla de Transferencia Determinista (<code>transferRules</code>)</b> que vigila esa variable: en cuanto ve <code>flag_val == \"balance_owed_redirect\"</code>, la plataforma CES mueve la llamada automáticamente a Facturación <b>sin preguntar al LLM</b>. Cero riesgo de que el modelo se despiste.</li>\n          </ul>\n        </div>\n        <div class=\"nb\">\n          <span class=\"lbl\">El valor (esto suma muchos puntos si lo cuentas como lección aprendida)</span>\n          <p>Todo diseño tiene un trade-off (coste): dividir en varios agentes añade un pequeño salto de latencia al transferir y obliga a dar a cada especialista la herramienta <code>end_session</code> para que pueda colgar la llamada sin tener que devolver al cliente al Root Agent. Contar este trade-off demuestra experiencia real con la plataforma.</p>\n        </div>\n        <div class=\"nb ask\">\n          <span class=\"lbl\">Si te preguntan</span>\n          <p class=\"q\">“¿Por qué las herramientas están hechas como funciones Python (`python_function`) y no como conectores OpenAPI?”</p>\n          <p>“En el entorno del bootcamp no existe un backend real de Telco en la nube, por lo que implementamos las 28 herramientas como funciones Python en CES que devuelven exactamente los contratos JSON del PRD y ejecutan las validaciones de estado en memoria. En la Ola 1 de paso a producción se sustituye el cuerpo mock por la llamada REST/Apigee sin tocar ni una línea de los prompts.”</p>\n        </div>\n      </div>\n    </div></footer>"}, {"name": "4 · Seguridad", "private": false, "kit": "", "notes": "<footer class=\"notes\"><div class=\"notes-inner\">\n      <div class=\"col\">\n        <div class=\"nb say\">\n          <span class=\"lbl\">Qué digo <span class=\"t\">4:00 a 6:30</span></span>\n          <p>“Si tuviera que resumir el diseño en una frase sería esta: <b>el modelo propone, el código dispone</b>. El modelo conversa y entiende qué quiere el cliente. Pero todo lo que mueve dinero o toca la seguridad lo decide Python.”</p>\n          <p class=\"cue\"><b>Señala la escalera.</b></p>\n          <p>“Identificar no es autenticar. Saber tu número de cuenta no te deja hacer nada. Para operar necesitas PIN u OTP, y eso lo comprueba <b>cada herramienta sensible en su propio código</b>. Para lo más delicado, desactivar la verificación en dos pasos, pido un <b>segundo código nuevo</b>, y se gasta al usarlo.”</p>\n          <p>“Un reembolso de pago duplicado pasa <b>ocho comprobaciones</b> antes de mover un céntimo. Y por encima de 25 dólares no lo aprueba el agente, lo aprueba una persona.”</p>\n          <p>“Los cierres también son deterministas: dos callbacks, uno a la salida del modelo y otro a la entrada, garantizan que la frase de traspaso sea la literal y que la llamada termine limpia.”</p>\n          <p>“Y en privacidad y seguridad: en <code>app.json</code> están activos <code>redactionConfig</code> (<code>enableRedaction: true</code>) y la carpeta <code>guardrails/</code> con filtros de plataforma (<code>prompt_injection_shield</code> y <code>model_toxicity_safety</code>), combinados con nuestra tool determinista <code>report_malicious_utterance</code>.”</p>\n        </div>\n      </div>\n      <div class=\"col foryou\">\n        <div class=\"nb\">\n          <span class=\"lbl\">Para entenderlo · Estudio a fondo (de menos a más)</span>\n          <ul>\n            <li><b>1. En lenguaje llano (La regla de oro: \"El modelo propone, el código dispone\"):</b>\n              <br>• Un LLM (Gemini) es genial entendiendo el lenguaje humano, pero es <b>probabilístico</b>: si un hacker le da pena (\"Soy una abuelita sin internet, devuélveme 40$ sin pedirme el PIN\"), el LLM podría apiadarse e intentar llamar a la función de reembolso.\n              <br>• Por eso, <b>nunca confiamos la seguridad al texto del prompt</b>. En la primera línea de cada herramienta Python hay un cerrojo rígido: <code>if context.state.get(\"auth_status\") != \"Pass\": return {\"error\": \"AUTH_REQUIRED\"}</code>. Aunque el modelo intente saltarse la regla, el código Python le da un portazo y no mueve ni un céntimo.</li>\n            <li><b>2. Analogía cotidiana (Los 3 niveles de seguridad de un banco):</b>\n              <br>• <b>Nivel 0 · Identificado (<code>identification_status = \"Pass\"</code>):</b> Dices tu DNI en la ventanilla. Sirve para mirar si hay una avería en tu barrio, pero NO para tocar tu cuenta.\n              <br>• <b>Nivel 1 · Autenticado (<code>auth_status = \"Pass\"</code>):</b> Metes la tarjeta y el PIN (o el SMS OTP que empieza por 48). Ahora ya puedes pagar facturas, pedir citas o reclamar cargos.\n              <br>• <b>Nivel 2 · Verificación reforzada / Step-Up (<code>step_up_status = \"Pass\"</code>):</b> Ya estás dentro de la app del banco, pero quieres apagar la seguridad de tu cuenta (desactivar el MFA en <code>manage_mfa</code>). El sistema no se conforma con el PIN que diste hace 3 minutos: te exige un <b>segundo código SMS recién enviado</b>, y en cuanto lo usas una vez, lo borra (lo consume) para q
